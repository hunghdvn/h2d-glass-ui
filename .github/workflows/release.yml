name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No registry-url: setup-node would write an .npmrc with a placeholder token, which npm would
      # send instead of asking GitHub for an OIDC token.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later; pnpm publish hands the tarball to this npm.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      # Opens or updates the "Version Packages" PR; once that PR is merged, publishes to npm through
      # trusted publishing (OIDC) with provenance. No npm token is stored in the repository.
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
