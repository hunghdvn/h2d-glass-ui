name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - id: package
        run: echo "private=$(node -p "require('./package.json').private === true")" >> "$GITHUB_OUTPUT"
      # Opens or updates the "Version Packages" PR; once that PR is merged, publishes to npm through
      # trusted publishing (OIDC) with provenance. No npm token is stored in the repository.
      # Skipped while the package is private: Changesets ignores it and the action would fail.
      - uses: changesets/action@v1
        if: steps.package.outputs.private != 'true'
        with:
          version: pnpm changeset version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
