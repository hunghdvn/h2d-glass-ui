name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:theme
      - run: pnpm lint
      - run: pnpm check:name
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm check:contrast
      - run: pnpm build
      - run: pnpm check:package

  stories:
    runs-on: ubuntu-latest
    # A full run takes about 7 minutes. A browser that stops answering would otherwise hold the job
    # for GitHub's default of 6 hours.
    timeout-minutes: 20
    # The Playwright image already holds the browsers and the system libraries they need, so the job
    # does not install them from Ubuntu's apt mirror, which once stalled until the timeout above. Its
    # tag must match `playwright` in package.json. --user 1001 is the runner's user, which owns the
    # workspace and HOME, as in Playwright's CI guide; --ipc=host as in the visual job.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:stories

  visual:
    runs-on: ubuntu-latest
    # About 6 minutes; the same guard as stories, since it drives browsers too.
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - run: pnpm check:docs-tables
      - run: pnpm test:visual:ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: playwright-report

  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same image and user as stories, for the same reason.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:fixtures
